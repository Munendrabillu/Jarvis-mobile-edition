
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>J.A.R.V.I.S - Personal AI Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>J.A.R.V.I.S</h1>
        <p>PERSONAL AI ASSISTANT</p>
    </header>

    <!-- AI Core -->
    <div class="core">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="center"></div>
    </div>

    <!-- Core Status -->
    <p class="core-text" id="core-text">SYSTEM READY</p>

    <!-- Diagnostics -->
    <section class="status">
        <h2>SYSTEM DIAGNOSTICS</h2>

        <div class="row">
            <span>AI ENGINE</span>
            <b id="ai-status" class="on">● READY</b>
        </div>

        <div class="row">
            <span>CONNECTION</span>
            <b id="connection-status" class="on">● ONLINE</b>
        </div>

        <div class="row">
            <span>VOICE INTERFACE</span>
            <b id="voice-status" class="on">● READY</b>
        </div>

        <div class="row">
            <span>LONG-TERM MEMORY</span>
            <b id="memory-status" class="on">● ACTIVE</b>
        </div>
    </section>

    <!-- Chat -->
    <main class="chat" id="chat" aria-live="polite"></main>

    <!-- Input -->
    <div class="input-area">

        <input
            type="text"
            id="msg"
            placeholder="Enter a command for J.A.R.V.I.S..."
            autocomplete="off"
            aria-label="Enter your command"
        >

        <button type="button" id="send">EXECUTE</button>

        <button type="button" id="mic-btn" aria-label="Voice input">
            🎙️
        </button>

        <button type="button" id="cam-btn" aria-label="Analyze image">
            📷
        </button>

        <button type="button" id="clear-btn">
            CLEAR MEMORY
        </button>

        <input
            type="file"
            id="img-input"
            accept="image/*"
            capture="environment"
            hidden
        >

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
