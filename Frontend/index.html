
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00ffff">
  <meta name="description" content="JARVIS Personal AI Assistant">

  <title>J.A.R.V.I.S Personal AI</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
  <link rel="apple-touch-icon" href="./icon-192.png">
</head>

<body>
  <div class="app">

    <header class="topbar">
      <button id="menu-btn" type="button">☰</button>
      <h1>J.A.R.V.I.S</h1>
      <button id="theme-btn" type="button">☀️</button>
    </header>

    <aside class="sidebar" id="sidebar">
      <button id="new-chat-btn" type="button">＋ New Chat</button>
      <h3>Chat History</h3>
      <div id="history-list"></div>
      <button id="settings-btn" type="button">⚙ Settings</button>
    </aside>

    <main class="main">

      <section class="hero">
        <div id="jarvis-orb" class="orb">
          <div class="orb-inner">J</div>
        </div>

        <h2>Good day, Sir.</h2>
        <p id="status">J.A.R.V.I.S systems online.</p>
      </section>

      <section id="chat-box" class="chat-box">
        <div class="welcome">
          <h2>How can I help you?</h2>
          <p>Your personal AI assistant is ready.</p>
        </div>
      </section>

      <div id="image-preview" class="image-preview"></div>

      <div class="input-area">
        <textarea
          id="user-input"
          placeholder="Ask JARVIS anything..."
          rows="1"
        ></textarea>

        <div class="controls">
          <button id="mic-btn" type="button" title="Voice">🎙️</button>
          <button id="cam-btn" type="button" title="Image">📷</button>
          <button id="send" type="button">SEND ➤</button>

          <input
            type="file"
            id="img-input"
            accept="image/*"
            capture="environment"
            hidden
          >
        </div>
      </div>

      <footer>
        <p>J.A.R.V.I.S Personal AI · Powered by Gemini</p>
        <button id="clear-btn" type="button">🧹 Clear Chat</button>
      </footer>
    </main>
  </div>

  <dialog id="settings-dialog">
    <h2>JARVIS Settings</h2>

    <label for="api-key">Gemini API Key</label>
    <input id="api-key" type="password" placeholder="Enter Gemini API Key">

    <label for="language">Response Language</label>
    <select id="language">
      <option value="both">English + Telugu</option>
      <option value="en">English</option>
      <option value="te">Telugu</option>
    </select>

    <label>
      <input type="checkbox" id="voice-toggle" checked>
      Enable spoken responses
    </label>

    <button id="save-settings" type="button">Save Settings</button>
    <button id="close-settings" type="button">Close</button>
  </dialog>

  <script src="./script.js"></script>
</body>
</html>
