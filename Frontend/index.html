
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#050b14">
    <meta name="description" content="J.A.R.V.I.S Mobile AI Assistant">

    <title>J.A.R.V.I.S - Mobile Edition</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>J.A.R.V.I.S</h1>
        <p>MOBILE EDITION</p>
    </header>

    <main>

        <!-- JARVIS CORE -->
        <section class="core" aria-label="JARVIS AI Core">
            <div class="ring r1"></div>
            <div class="ring r2"></div>
            <div class="center"></div>
        </section>

        <p class="core-text">CORE ACTIVE</p>

        <!-- SYSTEM STATUS -->
        <section class="status">
            <h2>SYSTEM STATUS</h2>

            <div class="row">
                <span>AI CORE</span>
                <b class="on">● ONLINE</b>
            </div>

            <div class="row">
                <span>NETWORK</span>
                <b class="on">● ONLINE</b>
            </div>

            <div class="row">
                <span>VOICE</span>
                <b class="off">○ LOCKED</b>
            </div>

            <div class="row">
                <span>MEMORY</span>
                <b class="off">○ LOCKED</b>
            </div>
        </section>

        <!-- CHAT AREA -->
        <section
            class="chat"
            id="chat"
            aria-label="Chat messages"
            aria-live="polite">
        </section>

        <!-- MESSAGE INPUT -->
        <form class="input-area" id="chatForm">

            <input
                type="text"
                id="msg"
                placeholder="Ask J.A.R.V.I.S..."
                aria-label="Enter your message"
                autocomplete="off"
                required
            >

            <button type="submit" id="send">
                SEND
            </button>

        </form>

    </main>

    <script src="script.js" defer></script>

</body>
</html>
