<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03131e"><title>J.A.R.V.I.S. Mobile</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<header><h1>J.A.R.V.I.S.</h1><div class="subtitle">MOBILE EDITION <span class="dot"></span></div></header>
<section class="core-wrap" aria-label="JARVIS core"><div class="core-ring ring1"><div class="ring2"><div class="ring3"><div class="core">J</div></div></div></div><div class="core-caption">CORE <b>ACTIVE</b></div><div class="init">SYSTEM INITIALIZED</div></section>
<section class="panel status"><h2><i>▤</i> SYSTEM STATUS <span class="line"></span></h2><div class="status-grid"><div><small>AI CORE</small><strong class="green">● ONLINE</strong></div><div><small>INTERFACE</small><strong class="green">● ACTIVE</strong></div><div><small>VOICE</small><strong id="voice-status" class="amber">○ READY</strong></div><div><small>MEMORY</small><strong class="amber">○ LOCAL</strong></div></div></section>
<section class="panel chat-panel"><h2><i>◇</i> COMMUNICATION LINK <span class="line"></span><button id="clear-chat" title="Clear chat">⌫</button></h2><div id="chat-messages" class="messages" aria-live="polite"></div><div class="composer"><textarea id="message-input" rows="1" placeholder="Enter a command..." aria-label="Message"></textarea><button id="mic-btn" class="mic" title="Voice input">♩</button><button id="send-btn" class="send">SEND <span>➤</span></button></div><div class="hint">PRESS ENTER TO SEND · SHIFT+ENTER FOR NEW LINE</div></section>
<footer>J.A.R.V.I.S. <span>PERSONAL AI INTERFACE</span></footer>
</main><script src="script.js"></script></body></html>
